<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .loader {
            text-align: center;
        }
        a {
            color: #38bdf8;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="loader">
        <p>Opening your email client...</p>
        <p style="font-size: 14px; color: #666;">If nothing happens, <a id="mail-link" href="mailto:egraich.dev@gmail.com">click here</a>.</p>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const link = document.getElementById('mail-link');
            // Эмуляция реального клика по ссылке для обхода блокировок браузера
            setTimeout(() => {
                link.click();
            }, 100);
        });
    </script>
</body>
</html>
